[package]
name = "rust-cli-file-uploader"
version = "0.1.0"
edition = "2024"

[dependencies]
structopt = "0.3.26"
reqwest = { version = "0.12.15", features = ["blocking", "multipart"] }
serde_json = "1.0.104"
tokio = {version = "1.29.1", features = ["full"] }
clap = { version = "3.0", features = ["derive"] }
